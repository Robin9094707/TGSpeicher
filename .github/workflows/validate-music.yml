name: Validate music and transfer update

on:
  push:
    branches: [codex/music-transfers-v3-3]

permissions:
  contents: read

concurrency:
  group: tgspeicher-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate migrations and compile app with extension
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Parse Swift sources
        run: find TGSpeicher Shared TGSpeicherLiveActivity -name '*.swift' -print0 | xargs -0 -n 1 swiftc -frontend -parse

      - name: Test recovery and upload journal
        run: |
          swiftc TGSpeicher/UploadQueueModels.swift TGSpeicher/Integrations/ConfirmationPolicy.swift TGSpeicher/Models.swift TGSpeicher/Music/MusicModels.swift TGSpeicher/Recovery/RecoveryCore.swift TGSpeicher/Recovery/DurableOutbox.swift TGSpeicher/Recovery/UploadPolicy.swift TGSpeicher/Recovery/DurableDeletionQueue.swift TGSpeicher/Chunker.swift Tests/RecoveryTests.swift -o /tmp/tgs-recovery-tests
          /tmp/tgs-recovery-tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TGSpeicher.xcodeproj \
            -scheme TGSpeicher

      - name: Build for iPhone and iPad
        run: |
          set -o pipefail
          xcodebuild \
            -project TGSpeicher.xcodeproj \
            -scheme TGSpeicher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-update-validation-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
