name: Build TGSpeicher IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tgspeicher-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply native video thumbnail fix
        run: python3 scripts/apply-video-thumbnail-fix.py

      - name: Commit thumbnail fix to main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- TGSpeicher/CloudStore.swift TGSpeicher/VideoThumbnailSupport.swift project.yml; then
            echo "Thumbnail fix already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TGSpeicher/CloudStore.swift TGSpeicher/VideoThumbnailSupport.swift project.yml
          git commit -m "TGSpeicher v2.4.1 native Telegram video thumbnails"
          git push origin HEAD:main

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TGSpeicher.xcodeproj \
            -scheme TGSpeicher

      - name: Build for iPhone and iPad
        run: |
          set -o pipefail
          xcodebuild \
            -project TGSpeicher.xcodeproj \
            -scheme TGSpeicher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/TGSpeicher.app"
          IPA_NAME="TGSpeicher-v2.4.1-unsigned.ipa"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/TGSpeicher.app
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          unzip -t "$IPA_NAME"
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGSpeicher-v2.4.1-unsigned-IPA
          path: TGSpeicher-v2.4.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TGSpeicher-v2.4.1-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
