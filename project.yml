name: TGSpeicher
options:
  bundleIdPrefix: eu.simplexsmp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    branch: main
targets:
  TGSpeicher:
    type: application
    platform: iOS
    sources:
      - path: TGSpeicher
    dependencies:
      - package: TDLibFramework
        product: TDLibFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.tgspeicher
        PRODUCT_NAME: TGSpeicher
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TGSpeicher/Info.plist
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0.1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
