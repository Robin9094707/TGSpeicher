name: TGSpeicher
options:
  bundleIdPrefix: eu.simplexsmp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    revision: 52d0d624cd5b01db0558c9dec3e07148c62ac205
targets:
  TGSpeicher:
    type: application
    platform: iOS
    sources:
      - path: TGSpeicher
    dependencies:
      - package: TDLibFramework
        product: TDLibFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.tgspeicher
        PRODUCT_NAME: TGSpeicher
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TGSpeicher/Info.plist
        CURRENT_PROJECT_VERSION: 24
        MARKETING_VERSION: 2.3.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
