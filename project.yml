name: TGSpeicher
options:
  bundleIdPrefix: eu.simplexsmp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    revision: 52d0d624cd5b01db0558c9dec3e07148c62ac205
targets:
  TGSpeicher:
    type: application
    platform: iOS
    sources:
      - path: TGSpeicher
    dependencies:
      - package: TDLibFramework
        product: TDLibFramework
      - target: BackgroundUploadExtension
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.tgspeicher
        PRODUCT_NAME: TGSpeicher
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TGSpeicher/Info.plist
        CODE_SIGN_ENTITLEMENTS: TGSpeicher/TGSpeicher.entitlements
        CURRENT_PROJECT_VERSION: 33
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 3.3.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
      gatherCoverageData: false

  BackgroundUploadExtension:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "27.0"
    sources:
      - path: BackgroundUploadExtension
      - path: TGSpeicher/BackgroundRelayShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.tgspeicher.backgroundupload
        PRODUCT_NAME: TGSpeicherBackgroundUpload
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BackgroundUploadExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BackgroundUploadExtension/BackgroundUploadExtension.entitlements
        CURRENT_PROJECT_VERSION: 33
        MARKETING_VERSION: 3.3.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
